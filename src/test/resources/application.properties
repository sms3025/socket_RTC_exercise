# =========================================================================
# 테스트 전용 설정 (src/test/resources 는 테스트 실행 시 main 설정을 덮어쓴다)
# =========================================================================
# 운영/개발용 application.properties 는 HTTPS(SSL)를 켜두었지만,
# 통합 테스트에서는 자체서명 인증서 신뢰 처리가 번거로우므로 SSL을 꺼서
# 평문 http/ws 로 간단히 접속되게 한다. (테스트의 관심사는 '1:1 라우팅'이지 TLS가 아님)
server.ssl.enabled=false

# 테스트 로그를 조용하게
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
