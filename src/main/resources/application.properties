spring.application.name=example

# =========================================================================
# HTTPS / WSS 설정 (A방법: 로컬 자체서명 인증서)
# =========================================================================
# ■ 왜 이 설정을 하나?
#   - 브라우저는 페이지가 https 로 열리면 WebSocket도 자동으로 wss(암호화)로 연결한다.
#   - 즉 "서버에 HTTPS를 켜는 것" = "wss 를 쓰는 것" 이다. (wss = HTTPS 위의 WebSocket)
#   - 이렇게 해두면 방화벽 통과, 그리고 다른 기기에서의 WebRTC 카메라 권한 문제까지 대비된다.
#
# ■ 아래 설정을 켜면 http(8080)는 더 이상 안 열리고 https(8443)만 열린다.
#   접속 주소가 https://localhost:8443/chat.html 로 바뀐다는 점에 주의!
#
# ■ 자체서명(self-signed) 인증서라 브라우저가 "안전하지 않음" 경고를 띄운다.
#   → "고급 → localhost로 이동(안전하지 않음)" 을 눌러 수동 허용하면 된다. (연습용이므로 정상)
server.port=8443

# SSL(TLS) 켜기
server.ssl.enabled=true
# 인증서가 담긴 키스토어 파일 (src/main/resources 안에 있으므로 classpath: 로 참조)
server.ssl.key-store=classpath:keystore.p12
# 키스토어 형식. keytool 로 만들 때 -storetype PKCS12 로 지정했다.
server.ssl.key-store-type=PKCS12
# 키스토어 비밀번호. keytool 의 -storepass 값과 같아야 한다.
#   ※ 실제 서비스에서는 이렇게 평문으로 두지 말고 환경변수/시크릿으로 분리한다. (연습이라 그대로 둠)
server.ssl.key-store-password=changeit
# 사용할 키의 별칭(alias). keytool 의 -alias 값과 같아야 한다.
server.ssl.key-alias=mafia-practice

# STOMP 메시지 관련 로그를 자세히 보면 학습에 도움이 된다.
# 서버 콘솔에 SUBSCRIBE / SEND 프레임이 흐르는 걸 눈으로 확인할 수 있다.
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
