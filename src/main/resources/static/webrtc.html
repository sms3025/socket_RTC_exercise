<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>[2단계] WebRTC 화상 연습</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
    #videos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .cell { text-align: center; }
    video { width: 260px; height: 195px; background: #222; border-radius: 8px; }
    .label { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h2>[2단계] WebRTC 화상 연습 (Mesh 방식)</h2>
  <p style="color:#666">
    두 개의 브라우저 탭(또는 다른 기기)에서 같은 방 번호로 입장하면 서로의 얼굴이 보인다.<br/>
    ※ 카메라 접근은 <b>localhost</b> 또는 <b>https</b> 에서만 허용된다.<br/>
    ※ 지금은 HTTPS(wss)를 켜뒀으므로 <b>https://localhost:8443/webrtc.html</b> 로 접속할 것.
    자체서명 인증서 경고가 뜨면 "고급 → 계속 진행"으로 허용하면 된다. (다른 기기에서 붙일 때 특히 https가 필수)
  </p>

  <div>
    방 번호: <input id="roomId" value="1" size="4" />
    <button onclick="join()">입장</button>
  </div>

  <div id="videos">
    <div class="cell">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">나 (local)</div>
    </div>
    <!-- 상대방 영상은 JS가 동적으로 여기 추가한다 -->
  </div>

<script>
/* ============================================================================
 * [핵심 개념] Mesh(그물망) 방식이란?
 *   방에 N명이 있으면 모든 사람이 서로 1:1로 직접 연결한다.
 *   3명이면 연결선이 3개, 4명이면 6개... (N*(N-1)/2 개)
 *   구현이 가장 쉬워서 학습용/소규모에 적합하다.
 *   인원이 많아지면(보통 5~6명 초과) 각자의 업로드 부담이 커져서, 그땐 SFU라는
 *   미디어 서버(예: mediasoup, Janus, LiveKit)를 도입한다. 마피아 게임 인원이 많다면
 *   나중에 SFU를 고려하게 될 것. 지금은 개념 학습이 목적이니 Mesh로 충분하다.
 *
 * [등장인물]
 *   - localStream : 내 카메라/마이크 영상 스트림
 *   - peers       : 상대방 ID -> RTCPeerConnection(연결 객체) 를 담는 map
 *   - myId        : 나를 식별하는 랜덤 ID (누가 보낸 신호인지 구분하는 데 씀)
 * ========================================================================== */

let stompClient = null;
let localStream = null;
let roomId = null;
const myId = 'user-' + Math.random().toString(36).substring(2, 9); // 간단한 랜덤 ID
const peers = {}; // { 상대ID: RTCPeerConnection }

// ICE 서버 설정: 공유기(NAT) 뒤에 있는 브라우저끼리도 서로의 공인 IP를 알아내게 도와주는 STUN 서버.
// 구글이 무료로 제공하는 공개 STUN을 쓴다. (회사/학교 방화벽이 심하면 TURN 서버가 추가로 필요)
const rtcConfig = {
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
};

async function join() {
  roomId = document.getElementById('roomId').value;

  // 1) 내 카메라/마이크 권한을 요청하고 스트림을 얻는다.
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('localVideo').srcObject = localStream;

  // 2) 시그널링 서버(STOMP)에 연결
  // '/ws' 는 상대 경로 → 페이지가 https 이면 자동으로 wss(암호화)로 연결된다.
  // WebRTC의 영상 자체는 P2P로 흐르지만, 그 협상 신호를 나르는 이 시그널링 채널이 wss로 보호된다.
  //
  // [3단계 추가] '?username=myId' 를 붙여 접속한다.
  //   → 서버의 UserHandshakeHandler 가 이 값을 읽어 내 연결에 이름표(Principal)를 붙인다.
  //   → 그래야 다른 사람이 나에게 convertAndSendToUser(myId, ...) 로 1:1 신호를 보낼 수 있다.
  stompClient = new StompJs.Client({
    webSocketFactory: () => new SockJS('/ws?username=' + encodeURIComponent(myId)),
    reconnectDelay: 5000,
  });

  stompClient.onConnect = () => {
    // 3-A) 방 전체 공지(JOIN/LEAVE)를 받는 구독. 방송이므로 방에 있는 모두가 받는다.
    stompClient.subscribe('/topic/signal/' + roomId, (frame) => {
      handleSignal(JSON.parse(frame.body));
    });

    // 3-B) [3단계 추가] "나에게 직접 온" 1:1 신호(OFFER/ANSWER/CANDIDATE)를 받는 구독.
    //   주소가 '/user/queue/signal' 인 점에 주목! '/user' 를 붙이면 스프링이
    //   "지금 이 연결(=나)에게 온 것만" 골라서 넣어준다. (다른 사람 신호는 안 들어옴)
    //   서버의 convertAndSendToUser(receiver, "/queue/signal", ...) 와 짝을 이룬다.
    stompClient.subscribe('/user/queue/signal', (frame) => {
      handleSignal(JSON.parse(frame.body));
    });

    // 4) "나 들어왔어!" 라고 방 전체에 알림 → 기존 참가자들이 나에게 OFFER를 보내줄 것.
    sendSignal({ type: 'JOIN', sender: myId });
  };

  stompClient.activate();
}

// 서버로 신호를 보내는 공통 함수 (roomId, sender는 공통으로 채워줌)
function sendSignal(payload) {
  stompClient.publish({
    destination: '/app/signal/' + roomId,
    body: JSON.stringify({ roomId, sender: myId, ...payload }),
  });
}

/* ----------------------------------------------------------------------------
 * 서버로부터 신호를 받았을 때의 처리 (WebRTC 협상의 심장부)
 * -------------------------------------------------------------------------- */
async function handleSignal(msg) {
  // 내가 보낸 JOIN 방송이 나에게 되돌아온 것은 무시한다. (OFFER/ANSWER/CANDIDATE 는
  // 이제 서버가 나에게만 직접 주므로, 예전처럼 receiver 로 걸러낼 필요가 없어졌다.)
  if (msg.sender === myId) return;

  switch (msg.type) {
    case 'JOIN':
      // 새 참가자가 들어왔다. "기존 참가자인 내가" 그 사람에게 OFFER를 보내 연결을 시작한다.
      // (규칙: 먼저 있던 사람이 새로 온 사람에게 건다 → 양쪽이 동시에 OFFER 보내는 충돌 방지)
      await createOffer(msg.sender);
      break;

    case 'OFFER':
      // 누군가 나에게 연결을 제안했다. 받아서 ANSWER로 응답한다.
      await handleOffer(msg);
      break;

    case 'ANSWER':
      // 내가 보낸 OFFER에 대한 응답이 왔다. 내 연결 객체에 상대의 답을 설정한다.
      await peers[msg.sender].setRemoteDescription(msg.data);
      break;

    case 'CANDIDATE':
      // 상대의 네트워크 경로 후보가 왔다. 내 연결 객체에 추가한다.
      if (peers[msg.sender]) {
        await peers[msg.sender].addIceCandidate(msg.data);
      }
      break;

    case 'LEAVE':
      // 상대가 나갔으니 연결을 정리하고 영상 칸을 지운다.
      removePeer(msg.sender);
      break;
  }
}

/* ----------------------------------------------------------------------------
 * RTCPeerConnection(상대 1명과의 연결 객체)을 만들고 공통 설정을 건다.
 * OFFER를 보낼 때든 받을 때든 이 함수를 먼저 호출한다.
 * -------------------------------------------------------------------------- */
function createPeerConnection(remoteId) {
  const pc = new RTCPeerConnection(rtcConfig);

  // (A) 내 카메라/마이크 트랙을 이 연결에 실어 보낸다 → 상대가 내 영상을 받게 됨.
  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

  // (B) 내 브라우저가 네트워크 경로 후보(ICE candidate)를 찾을 때마다 호출된다.
  //     찾는 즉시 상대에게 보내줘야 연결이 빨리 맺어진다. (여러 번 발생하는 게 정상)
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal({ type: 'CANDIDATE', receiver: remoteId, data: event.candidate });
    }
  };

  // (C) 상대의 영상 트랙이 도착하면 호출된다 → 화면에 상대 영상을 붙인다.
  pc.ontrack = (event) => {
    addRemoteVideo(remoteId, event.streams[0]);
  };

  peers[remoteId] = pc;
  return pc;
}

// 내가 상대(remoteId)에게 연결을 제안(OFFER)한다.
async function createOffer(remoteId) {
  const pc = createPeerConnection(remoteId);
  const offer = await pc.createOffer();       // 내 조건(SDP)을 만들고
  await pc.setLocalDescription(offer);        // 내 쪽에 저장한 뒤
  sendSignal({ type: 'OFFER', receiver: remoteId, data: offer }); // 상대에게 전송
}

// 상대의 OFFER를 받아서 ANSWER로 응답한다.
async function handleOffer(msg) {
  const pc = createPeerConnection(msg.sender);
  await pc.setRemoteDescription(msg.data);    // 상대의 제안을 내 연결에 설정
  const answer = await pc.createAnswer();      // 응답(SDP)을 만들고
  await pc.setLocalDescription(answer);        // 내 쪽에 저장한 뒤
  sendSignal({ type: 'ANSWER', receiver: msg.sender, data: answer }); // 상대에게 전송
}

/* ----------------------------------------------------------------------------
 * 화면(DOM) 관리
 * -------------------------------------------------------------------------- */
function addRemoteVideo(remoteId, stream) {
  // 이미 있으면 중복 추가 방지
  if (document.getElementById('cell-' + remoteId)) return;

  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.id = 'cell-' + remoteId;
  cell.innerHTML = `
    <video id="video-${remoteId}" autoplay playsinline></video>
    <div class="label">${remoteId}</div>`;
  document.getElementById('videos').appendChild(cell);
  document.getElementById('video-' + remoteId).srcObject = stream;
}

function removePeer(remoteId) {
  if (peers[remoteId]) {
    peers[remoteId].close();  // 연결 종료
    delete peers[remoteId];
  }
  const cell = document.getElementById('cell-' + remoteId);
  if (cell) cell.remove();    // 영상 칸 제거
}

// 탭을 닫을 때 방에 퇴장을 알림
window.addEventListener('beforeunload', () => {
  if (stompClient && stompClient.connected) sendSignal({ type: 'LEAVE', sender: myId });
});
</script>
</body>
</html>
